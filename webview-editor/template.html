<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Editor</title>
  <style>
    /* ---------- 主题变量（默认·浅色） ---------- */
    :root {
      --bg: #ffffff;
      --fg: #26282e;
      --muted: #8a8d96;
      --border: #e6e7eb;
      --accent: #2f6fed;
      --code-bg: #f4f5f7;
      --block-bg: #f8f9fb;

      --cm-bg: #ffffff;
      --cm-fg: #26282e;
      --cm-gutter: #b0b3bd;
      --cm-active-line: rgba(0, 0, 0, 0.045);
      --cm-selection: rgba(47, 111, 237, 0.18);
      --cm-accent: #2f6fed;
      --cm-heading: #171922;
      --cm-code: #b6376a;
      --cm-code-bg: rgba(27, 31, 35, 0.06);
      --cm-quote: #7a7f8c;
      --cm-meta: #9aa0ab;
      --cm-url: #0550ae;
      --cm-kw: #cf222e;
      --cm-str: #0a3069;
      --cm-num: #0550ae;
      --cm-comment: #6e7781;
      --cm-type: #8250df;
      --cm-fn: #8250df;

      /* 编辑器设置（XT-02） */
      --cm-font-size: 16px;
      --cm-line-height: 1.7;
      --cm-font-family: 'SF Mono', Menlo, Consolas, 'PingFang SC', monospace;
    }

    /* ---------- 主题变量（默认·深色） ---------- */
    html.dark {
      --bg: #1e1f24;
      --fg: #d8dae2;
      --muted: #8b8e99;
      --border: #33353c;
      --accent: #5b8def;
      --code-bg: #26272e;
      --block-bg: #23242b;

      --cm-bg: #1e1f24;
      --cm-fg: #d8dae2;
      --cm-gutter: #4d505b;
      --cm-active-line: rgba(255, 255, 255, 0.05);
      --cm-selection: rgba(91, 141, 239, 0.32);
      --cm-accent: #5b8def;
      --cm-heading: #f0f1f5;
      --cm-code: #e593b9;
      --cm-code-bg: rgba(255, 255, 255, 0.08);
      --cm-quote: #9aa0ab;
      --cm-meta: #7a7f8c;
      --cm-url: #79c0ff;
      --cm-kw: #ff7b72;
      --cm-str: #a5d6ff;
      --cm-num: #79c0ff;
      --cm-comment: #8b949e;
      --cm-type: #d2a8ff;
      --cm-fn: #d2a8ff;
    }

    /* ---------- 墨黑（纯黑极简） ---------- */
    html[data-theme='ink'] {
      --bg: #000000;
      --fg: #e6e6e6;
      --muted: #808080;
      --border: #232323;
      --accent: #6ea8fe;
      --code-bg: #121212;
      --block-bg: #0d0d0d;

      --cm-bg: #000000;
      --cm-fg: #e6e6e6;
      --cm-gutter: #3d3d3d;
      --cm-active-line: rgba(255, 255, 255, 0.06);
      --cm-selection: rgba(110, 168, 254, 0.30);
      --cm-accent: #6ea8fe;
      --cm-heading: #ffffff;
      --cm-code: #ef9ebb;
      --cm-code-bg: rgba(255, 255, 255, 0.08);
      --cm-quote: #949494;
      --cm-meta: #7c7c7c;
      --cm-url: #82cfff;
      --cm-kw: #ff7b72;
      --cm-str: #a5d6ff;
      --cm-num: #79c0ff;
      --cm-comment: #737373;
      --cm-type: #d2a8ff;
      --cm-fn: #d2a8ff;
    }

    /* ---------- Nord ---------- */
    html[data-theme='nord'] {
      --bg: #2e3440;
      --fg: #d8dee9;
      --muted: #7b88a1;
      --border: #434c5e;
      --accent: #88c0d0;
      --code-bg: #3b4252;
      --block-bg: #353b49;

      --cm-bg: #2e3440;
      --cm-fg: #d8dee9;
      --cm-gutter: #4c566a;
      --cm-active-line: rgba(216, 222, 233, 0.06);
      --cm-selection: rgba(136, 192, 208, 0.28);
      --cm-accent: #88c0d0;
      --cm-heading: #eceff4;
      --cm-code: #b48ead;
      --cm-code-bg: rgba(216, 222, 233, 0.10);
      --cm-quote: #8f9cb3;
      --cm-meta: #7b88a1;
      --cm-url: #8fbcbb;
      --cm-kw: #81a1c1;
      --cm-str: #a3be8c;
      --cm-num: #b48ead;
      --cm-comment: #6f7d95;
      --cm-type: #8fbcbb;
      --cm-fn: #88c0d0;
    }

    /* ---------- Solarized Light ---------- */
    html[data-theme='solarized'] {
      --bg: #fdf6e3;
      --fg: #586e75;
      --muted: #93a1a1;
      --border: #ddd6c1;
      --accent: #268bd2;
      --code-bg: #eee8d5;
      --block-bg: #f5eed9;

      --cm-bg: #fdf6e3;
      --cm-fg: #586e75;
      --cm-gutter: #c3bca8;
      --cm-active-line: rgba(88, 110, 117, 0.06);
      --cm-selection: rgba(38, 139, 210, 0.16);
      --cm-accent: #268bd2;
      --cm-heading: #073642;
      --cm-code: #d33682;
      --cm-code-bg: rgba(88, 110, 117, 0.10);
      --cm-quote: #93a1a1;
      --cm-meta: #93a1a1;
      --cm-url: #268bd2;
      --cm-kw: #859900;
      --cm-str: #2aa198;
      --cm-num: #d33682;
      --cm-comment: #93a1a1;
      --cm-type: #b58900;
      --cm-fn: #268bd2;
    }

    /* ---------- Dracula ---------- */
    html[data-theme='dracula'] {
      --bg: #282a36;
      --fg: #f8f8f2;
      --muted: #6272a4;
      --border: #44475a;
      --accent: #bd93f9;
      --code-bg: #21222c;
      --block-bg: #343746;

      --cm-bg: #282a36;
      --cm-fg: #f8f8f2;
      --cm-gutter: #6272a4;
      --cm-active-line: rgba(248, 248, 242, 0.05);
      --cm-selection: rgba(189, 147, 249, 0.30);
      --cm-accent: #bd93f9;
      --cm-heading: #ffffff;
      --cm-code: #ff79c6;
      --cm-code-bg: rgba(248, 248, 242, 0.08);
      --cm-quote: #9aa7c4;
      --cm-meta: #6272a4;
      --cm-url: #8be9fd;
      --cm-kw: #ff79c6;
      --cm-str: #f1fa8c;
      --cm-num: #bd93f9;
      --cm-comment: #6272a4;
      --cm-type: #8be9fd;
      --cm-fn: #50fa7b;
    }

    /* ---------- GitHub Light ---------- */
    html[data-theme='github-light'] {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --code-bg: #f6f8fa;
      --block-bg: #f6f8fa;

      --cm-bg: #ffffff;
      --cm-fg: #1f2328;
      --cm-gutter: #8c959f;
      --cm-active-line: rgba(9, 105, 218, 0.05);
      --cm-selection: rgba(9, 105, 218, 0.16);
      --cm-accent: #0969da;
      --cm-heading: #1f2328;
      --cm-code: #953800;
      --cm-code-bg: rgba(175, 184, 193, 0.2);
      --cm-quote: #656d76;
      --cm-meta: #8c959f;
      --cm-url: #0969da;
      --cm-kw: #cf222e;
      --cm-str: #0a3069;
      --cm-num: #0550ae;
      --cm-comment: #6e7781;
      --cm-type: #8250df;
      --cm-fn: #8250df;
    }

    * {
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      /* 基础字号 ≥16px，避免 iOS 聚焦输入框时自动放大 */
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 16px;
    }

    #editor {
      height: 100%;
    }

    /* 聚焦模式：非当前段落变暗 */
    .cm-dim-line {
      opacity: 0.4;
    }

    /* 导出时隐藏的渲染容器 */
    .export-holder {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 780px;
      visibility: hidden;
    }

    /* ---------- 预览模式 ---------- */
    #preview {
      display: none;
      box-sizing: border-box;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 18px 48px;
      word-wrap: break-word;
    }

    .preview-loading {
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
      font-size: 14px;
    }

    #preview h1,
    #preview h2,
    #preview h3,
    #preview h4,
    #preview h5,
    #preview h6 {
      margin: 1.2em 0 0.5em;
      line-height: 1.35;
      font-weight: 700;
    }

    #preview h1 {
      font-size: 1.6em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
    }

    #preview h2 {
      font-size: 1.35em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.25em;
    }

    #preview h3 {
      font-size: 1.18em;
    }

    #preview h4,
    #preview h5,
    #preview h6 {
      font-size: 1.05em;
    }

    #preview p {
      margin: 0.6em 0;
      line-height: 1.8;
    }

    #preview a {
      color: var(--accent);
    }

    #preview a.wiki-link {
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
    }

    #preview code {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      background: var(--code-bg);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.9em;
    }

    #preview pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      line-height: 1.6;
    }

    #preview pre code {
      background: none;
      padding: 0;
      font-size: 0.88em;
    }

    #preview blockquote {
      margin: 0.8em 0;
      padding: 4px 14px;
      border-left: 4px solid var(--accent);
      color: var(--muted);
      background: var(--block-bg);
      border-radius: 0 6px 6px 0;
    }

    #preview ul,
    #preview ol {
      padding-left: 1.6em;
      line-height: 1.8;
      margin: 0.5em 0;
    }

    #preview li {
      margin: 0.2em 0;
    }

    #preview img {
      max-width: 100%;
      border-radius: 6px;
    }

    #preview table {
      border-collapse: collapse;
      margin: 0.8em 0;
      width: 100%;
      font-size: 0.92em;
    }

    #preview th,
    #preview td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }

    #preview th {
      background: var(--block-bg);
      font-weight: 600;
    }

    #preview hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5em 0;
    }

    #preview input[type='checkbox'] {
      margin-right: 6px;
    }

    /* ==高亮==（FE-03） */
    #preview mark {
      background: rgba(255, 212, 0, 0.4);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* GFM 脚注（FE-03） */
    #preview .footnotes {
      font-size: 0.88em;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 2em;
      padding-top: 0.8em;
    }

    #preview .footnotes li {
      margin: 0.3em 0;
    }

    /* [TOC] 目录（FE-03） */
    #preview .toc {
      background: var(--block-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      margin: 0.8em 0;
    }

    #preview .toc .toc-title {
      font-weight: 700;
      font-size: 0.92em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    #preview .toc ul.toc-list {
      padding-left: 0;
      margin: 0;
      list-style: none;
    }

    #preview .toc li {
      line-height: 1.9;
      font-size: 0.94em;
    }

    #preview .toc li.toc-l1 { padding-left: 0; }
    #preview .toc li.toc-l2 { padding-left: 1em; }
    #preview .toc li.toc-l3 { padding-left: 2em; }
    #preview .toc li.toc-l4 { padding-left: 3em; }
    #preview .toc li.toc-l5 { padding-left: 4em; }
    #preview .toc li.toc-l6 { padding-left: 5em; }

    #preview .toc a {
      text-decoration: none;
    }

    #preview .toc-empty {
      color: var(--muted);
      font-size: 0.9em;
    }

    /* 数学公式（FE-01） */
    #preview .math-block,
    #preview .katex-display {
      margin: 0.8em 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0;
    }

    #preview .math-error {
      display: inline-block;
      color: #d63384;
      background: rgba(214, 51, 132, 0.08);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.9em;
    }

    /* Mermaid（FE-02） */
    #preview .mermaid-src {
      text-align: center;
      margin: 0.8em 0;
      overflow-x: auto;
    }

    #preview .mermaid-src svg {
      max-width: 100%;
    }

    .mermaid-error {
      text-align: left;
      color: #b43434;
      border: 1px solid rgba(180, 52, 52, 0.4);
      background: rgba(180, 52, 52, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
  <style id="katex-css">/* __KATEX_CSS__ */</style>
</head>
<body>
  <div id="editor"></div>
  <div id="preview"></div>
  <script>/* __EDITOR_JS__ */</script>
</body>
</html>
